services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeconnect}
      POSTGRES_DB: ${POSTGRES_DB:-codeconnect}
    ports:
      - "5432:5432"
    volumes:
      # Named volume keeps the data across container restarts and recreation.
      - postgres-data:/var/lib/postgresql/data
      # Scripts here run only when the volume is empty (first start).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
